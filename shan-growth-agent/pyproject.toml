[project]
name = "shan-growth-agent"
version = "0.1.0"
description = "Lightweight agentic system for SEO monitoring, content growth and social integration for Scuola Kung Fu Maestro Cipriani."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Giuseppe Chiapparo" }]

dependencies = [
    # HTTP + parsing
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    # Scheduling
    "apscheduler>=3.10",
    # Config & validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Logging
    "structlog>=24.4",
    # LLM SDKs
    "anthropic>=0.39",
    "openai>=1.54",
    # SSL / cert inspection
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.32",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
shan = "shan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR0913"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
